<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WildTrack Adventure Camp Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color:chocolate ;
      background-size: cover;
      background-position: center;
      font-family: 'Poppins', sans-serif;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 30px;
      max-width: 450px;
      margin: 80px auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .form-title {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
      color: #2b3e2e;
    }

    label {
      font-weight: 500;
    }

    .btn-register {
      background-color: #2e8b57;
      color: white;
      border: none;
      width: 100%;
      font-size: 18px;
      padding: 10px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-register:hover {
      background-color: #226b44;
      transform: scale(1.03);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2 class="form-title">Adventure Camp Registration</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <input type="number" class="form-control" id="age" placeholder="Enter your age" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Gender</label>
        <select class="form-select" required>
          <option selected disabled>Choose...</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="contact" class="form-label">Contact Number</label>
        <input type="tel" class="form-control" id="contact" placeholder="Enter your phone number" required>
      </div>

      <div class="mb-3">
        <label for="camp-type" class="form-label">Camp Type</label>
        <select class="form-select" id="camp-type" required>
          <option selected disabled>Select Camp Type</option>
          <option>Mountain Trekking</option>
          <option>River Rafting</option>
          <option>Forest Exploration</option>
          <option>Wildlife Photography</option>
        </select>
      </div>

      <button type="submit" class="btn-register">Register Now</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
